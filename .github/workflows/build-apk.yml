
name: Build MindQuest APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Unpack MindQuest source
        run: unzip -q MindQuestAndroid_Source.zip -d project

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      
      - name: Use installed Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
  

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      
      - name: Install Android 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
  

      - name: Check project assets
        working-directory: project
        run: python3 check_project.py

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MindQuest-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
